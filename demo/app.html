<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PUMIX 앱</title>
  <meta name="description" content="PUMIX 해커톤 데모 — 가족 영양제 앱 화면 (모든 데이터는 가상)">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
  <link href="css/mirror.css" rel="stylesheet">
  <script>
    // 시연은 늘 분할 화면(왼쪽 기기 + 오른쪽 앱). 앱 주소를 직접 열면 분할 화면으로 넘긴다 (사용자 결정 11-21)
    // 단, ?room= 이 있으면 휴대폰으로 기기를 조종하는 주소라 앱만 연다 (기기 화면의 QR)
    if (window.self === window.top && !new URLSearchParams(location.search).get('room')) location.replace('index.html' + location.search.replace(/([?&])(view|split|relay)=[^&]*&?/g, '$1').replace(/[?&]$/, ''));
  </script>
  <script>
    // 아이폰 틀: 넓은 화면이거나 분할 모드(?view=mirror)면 처음부터 켠다 (깜빡임 방지, app.js가 크기 변경 때 다시 판단)
    (function () { var m = new URLSearchParams(location.search).get('view') === 'mirror';
      if (m) document.documentElement.classList.add('is-mirror');
      if (m || matchMedia('(min-width: 40rem)').matches) document.documentElement.classList.add('is-framed'); })();
  </script>
  <script src="vendor/supabase.js"></script>
  <script type="module" src="js/app/app.js"></script>
</head>
<body class="app-page">
  <header class="topbar">
    <p class="topbar__name">PUMIX</p>
    <p class="topbar__meta">가상 데이터</p>
    <p class="conn" id="conn" data-status="none" title="기기 페이지가 열려 있지 않아요"><span>기기 없음</span></p>
    <p class="topbar__meta">방 <span id="room">demo</span></p>
    <button class="topbar__btn" id="ring-alarm">복용 알람 울리기</button>
    <button class="topbar__btn" id="reset">시나리오 초기화</button>
  </header>

  <div class="stage-wrap">
    <p class="mirror-cap" aria-hidden="true"><span class="mirror-cap__live"></span><svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>iPhone 미러링 · 엄마의 휴대폰(가상)</p>
    <div class="phone">
      <div class="phone__screen">
        <div class="bokeh" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="statusbar" aria-hidden="true"><span>9:41</span><span class="statusbar__icons"><b></b><b></b><b></b></span></div>
        <div class="ios-island" aria-hidden="true"></div>
        <main class="app-main" id="screen" tabindex="-1">
          <noscript><p class="load-error">이 데모는 자바스크립트가 필요해요.</p></noscript>
          <p class="load-msg">불러오는 중</p>
        </main>
        <p class="toast" id="toast" role="status" hidden></p>
        <div class="alarm" id="alarm" role="alert" aria-label="복용 알람" hidden></div>
        <nav class="tabbar" aria-label="앱 메뉴">
          <button data-tab="home" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>홈</span></button>
          <button data-tab="supplements"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 20.5 3.5 13.5a4.95 4.95 0 1 1 7-7l7 7a4.95 4.95 0 1 1-7 7Z"/><path d="m8.5 8.5 7 7"/></svg><span>영양제</span></button>
          <button data-tab="safety"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/></svg><span>가족 안전</span></button>
          <button data-tab="health"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 20V10M12 20V4M6 20v-6"/></svg><span>건강</span></button>
          <button data-tab="menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>설정</span></button>
        </nav>
        <div class="ios-home" aria-hidden="true"></div>
      </div>
    </div>
  </div>

  <footer class="virtual-note">모든 인물·제품·수치는 가상입니다</footer>
</body>
</html>
